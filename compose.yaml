services:
  devscope:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${DEVSCOPE_BIND_ADDRESS:-127.0.0.1}:${DEVSCOPE_PORT:-8080}:8080"
    environment:
      ASPNETCORE_URLS: http://+:8080
      DevScope__DataSource: ${DEVSCOPE_DATA_SOURCE:-Mock}
      DevScope__McpConfigPath: /app/config/${DEVSCOPE_MCP_CONFIG_FILE:-mcp.json}
      DevScope__TeamsConfigPath: /app/config/teams.json
      DevScope__ProjectKey: ${DEVSCOPE_PROJECT_KEY:-FINTDR}
      DevScope__DeveloperGroup: ${DEVSCOPE_DEVELOPER_GROUP:-Fintender-Backend}
      DevScope__GitLabBaseUrl: ${DEVSCOPE_GITLAB_BASE_URL:-}
      DevScope__DailyRefreshHour: ${DEVSCOPE_DAILY_REFRESH_HOUR:-3}
      ConnectionStrings__DevScope: Host=postgres;Port=5432;Database=${DEVSCOPE_DB_NAME:-devscope};Username=${DEVSCOPE_DB_USER:-devscope};Password=${DEVSCOPE_DB_PASSWORD:-devscope-local-only}
      TZ: Europe/Moscow
    volumes:
      - ./config:/app/config:ro
      - ./certs:/usr/local/share/ca-certificates/devscope:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DEVSCOPE_DB_NAME:-devscope}
      POSTGRES_USER: ${DEVSCOPE_DB_USER:-devscope}
      POSTGRES_PASSWORD: ${DEVSCOPE_DB_PASSWORD:-devscope-local-only}
      TZ: Europe/Moscow
    volumes:
      - devscope-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DEVSCOPE_DB_USER:-devscope} -d ${DEVSCOPE_DB_NAME:-devscope}"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  mock-mcp:
    profiles: ["mock"]
    build:
      context: .
      dockerfile: Dockerfile.mock
    environment:
      ASPNETCORE_URLS: http://+:8090
      MockData__Path: /app/data/mock-data.json
    volumes:
      - ./data/mock-data.json:/app/data/mock-data.json:ro
    expose:
      - "8090"
    restart: unless-stopped

volumes:
  devscope-postgres:

